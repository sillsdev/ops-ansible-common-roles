---
# Installs and configures the CSF firewall
# Authors: Carson Wiens, Stephen Papierski, Cambell Prince

- name: Installing perl
  ansible.builtin.apt:
    name: perl
    state: present

- name: Downloading Config Server Firewall
  ansible.builtin.get_url:
    url: https://download.configserver.com/csf.tgz
    dest: /usr/local/src
    force: false
    validate_certs: false
    mode: '0644'

- name: Extracting Config Server Firewall
  ansible.builtin.unarchive:
    src: /usr/local/src/csf.tgz
    dest: /usr/local/src/
    remote_src: true

- name: Installing Config Server Firewall
  ansible.builtin.command: sh ./install.sh
  args:
    chdir: /usr/local/src/csf
    creates: /etc/csf/csf.conf

- name: Running the CSF test script...
  ansible.builtin.command: perl /etc/csf/csftest.pl
  register: csf_output
  changed_when: false
  failed_when: "'FATAL' in csf_output.stdout"
